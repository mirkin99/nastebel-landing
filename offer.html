<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Публичная оферта — NASTEBEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Manrope", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.65;
      color: #2a2c28;
      background: #ffffff;
      min-height: 100dvh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid rgba(42,44,40,0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar a {
      font-size: 14px;
      font-weight: 600;
      color: #4a4e48;
      text-decoration: none;
    }
    .topbar a:hover { color: #2a2c28; }
    .brand {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-size: 15px;
      color: #2a2c28;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      color: #2a2c28;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #7a7e76;
      margin-bottom: 36px;
      font-weight: 500;
    }
    h2.sec {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin: 28px 0 14px;
      color: #2a2c28;
      letter-spacing: 0.01em;
    }
    p.clause, p.para {
      margin-bottom: 12px;
      color: #2a2c28;
      text-align: justify;
      hyphens: auto;
    }
    hr.sec-div {
      border: none;
      border-top: 1px solid rgba(42,44,40,0.1);
      margin: 28px 0;
    }
    .footer-req {
      margin-top: 8px;
      padding-top: 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #4a4e48;
    }
    @media (max-width: 600px) {
      .wrap { padding: 24px 16px 48px; }
      body { font-size: 14px; }
      p.clause, p.para { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← Назад</a>
    <span class="brand">NASTEBEL</span>
  </div>
  <main class="wrap">
    <h1>ПУБЛИЧНАЯ ОФЕРТА</h1>
    <p class="subtitle">на выполнение работ по созданию флористических композиций</p>
PLACEHOLDER_BODY
  </main>
</body>
</html>
